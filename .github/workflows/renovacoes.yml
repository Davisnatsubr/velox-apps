name: Gerar app Renovações (Android)

# Roda a cada envio para a branch app-renovacoes, ou pelo botão "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [app-renovacoes]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Separar o arquivo
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/release/*.apk "saida/Renovacoes-1.0.${{ github.run_number }}.apk"
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: renovacoes-android-1.0.${{ github.run_number }}
          path: saida/

      # guarda o APK (ou o erro) na branch "builds-renovacoes"
      - name: Publicar na branch builds-renovacoes
        if: always()
        run: |
          mkdir -p saida && tail -n 60 build.log > saida/build.log 2>/dev/null || true
          echo "${{ job.status }} run=${{ github.run_number }} commit=${{ github.sha }}" > saida/STATUS.txt
          cd saida
          git init -q && git checkout -q -b builds-renovacoes
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds-renovacoes
