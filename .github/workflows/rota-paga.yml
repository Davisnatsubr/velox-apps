name: Gerar app Rota Paga

# Roda a cada envio que mexe na pasta rota-paga, ou pelo botão "Run workflow" na aba Actions.
on:
  workflow_dispatch:
  push:
    branches: [main, rota-paga]
    paths: ['rota-paga/**', '.github/workflows/rota-paga.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Biblioteca do mapa (Leaflet)
        run: bash rota-paga/tools/baixar-leaflet.sh

      - name: Chave de assinatura (opcional, a mesma dos outros apps)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/release.jks"; echo "Assinando com a chave de upload."; fi

      - name: Compilar
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          TASKS="assembleDebug"
          if [ -f "$GITHUB_WORKSPACE/release.jks" ]; then TASKS="$TASKS assembleRelease bundleRelease"; fi
          gradle -p rota-paga --no-daemon --stacktrace $TASKS 2>&1 | tee build.log

      - name: Separar os arquivos
        run: |
          N=${{ github.run_number }}
          mkdir -p saida
          cp rota-paga/app/build/outputs/apk/debug/*.apk "saida/RotaPaga-1.0.$N-teste.apk"
          if ls rota-paga/app/build/outputs/apk/release/*.apk >/dev/null 2>&1; then cp rota-paga/app/build/outputs/apk/release/*.apk "saida/RotaPaga-1.0.$N.apk"; fi
          if ls rota-paga/app/build/outputs/bundle/release/*.aab >/dev/null 2>&1; then cp rota-paga/app/build/outputs/bundle/release/*.aab "saida/RotaPaga-1.0.$N.aab"; fi
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: rota-paga-1.0.${{ github.run_number }}
          path: saida/

      # Link fácil de baixar pelo celular: aba "Releases" do repositório
      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=${{ github.run_number }}
          gh release create "rota-paga-1.0.$N" saida/* --target "$GITHUB_SHA" --prerelease \
            --title "Rota Paga 1.0.$N" \
            --notes "Instale o RotaPaga-1.0.$N-teste.apk no celular para testar (autorize 'instalar apps desconhecidos'). O .aab, quando houver, é o arquivo para a Play Store."

      # guarda o resultado (ou o erro) na branch "builds-rota-paga"
      - name: Status na branch builds-rota-paga
        if: always()
        run: |
          mkdir -p status && cp build.log status/ 2>/dev/null || true
          tail -n 80 build.log > status/build-fim.log 2>/dev/null || true
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log > status/erros.log 2>/dev/null || true
          echo "${{ job.status }} run=${{ github.run_number }} commit=${{ github.sha }}" > status/STATUS.txt
          cd status && git init -q && git checkout -q -b builds-rota-paga && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds-rota-paga

  previa:
    # Abre o app num navegador de verdade (com mapa, GPS simulado e cálculo de rota) e tira prints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Biblioteca do mapa (Leaflet)
        run: bash rota-paga/tools/baixar-leaflet.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Navegador
        run: |
          pip install playwright==1.47.0
          python -m playwright install --with-deps chromium
      - name: Prints
        run: python rota-paga/tools/previa.py rota-paga/app/src/main/assets/www previa
      - name: Publicar prints na branch previa-rota-paga
        if: always()
        run: |
          mkdir -p previa && cd previa && git init -q && git checkout -q -b previa-rota-paga && git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "previa ${{ github.run_number }}" --allow-empty
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" previa-rota-paga
