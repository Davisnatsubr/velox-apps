name: Gerar apps Android

# Roda sozinho a cada envio para a branch main, ou pelo botão "Run workflow" na aba Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Chave de assinatura
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "Assinando com a sua chave de upload."
          else
            echo "::warning::Secret KEYSTORE_BASE64 não configurado: os arquivos saem com a chave de teste e NÃO servem para a Play Store."
          fi

      - name: Compilar Velox e Pulso (APK + AAB)
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace assembleRelease bundleRelease

      - name: Separar os arquivos
        run: |
          N=${{ github.run_number }}
          mkdir -p saida
          cp app/build/outputs/apk/velox/release/*.apk "saida/VeloxPlay-1.0.$N.apk"
          cp app/build/outputs/apk/pulso/release/*.apk "saida/PulsoPlay-1.0.$N.apk"
          cp app/build/outputs/bundle/veloxRelease/*.aab "saida/VeloxPlay-1.0.$N.aab"
          cp app/build/outputs/bundle/pulsoRelease/*.aab "saida/PulsoPlay-1.0.$N.aab"
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: apps-android-1.0.${{ github.run_number }}
          path: saida/
