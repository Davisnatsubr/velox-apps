name: Gerar apps Android

# Roda sozinho a cada envio para a branch main, ou pelo botão "Run workflow" na aba Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['ios/**', '.github/workflows/ios.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # o Ubuntu do GitHub já vem com o Android SDK; só aceita as licenças
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Chave de assinatura (opcional)
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "Assinando com a chave de upload."
          else
            echo "Sem a chave: os arquivos saem sem assinatura e são assinados depois."
          fi

      - name: Compilar Velox e Pulso (APK direto + AAB Play Store)
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleVeloxDiretoRelease assemblePulsoDiretoRelease bundleVeloxPlayRelease bundlePulsoPlayRelease 2>&1 | tee build.log

      - name: Separar os arquivos
        run: |
          N=${{ github.run_number }}
          mkdir -p saida
          cp app/build/outputs/apk/veloxDireto/release/*.apk "saida/VeloxPlay-1.0.$N.apk"
          cp app/build/outputs/apk/pulsoDireto/release/*.apk "saida/PulsoPlay-1.0.$N.apk"
          cp app/build/outputs/bundle/veloxPlayRelease/*.aab "saida/VeloxPlay-1.0.$N.aab"
          cp app/build/outputs/bundle/pulsoPlayRelease/*.aab "saida/PulsoPlay-1.0.$N.aab"
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          cp "$ANDROID_HOME/build-tools/$BT/lib/apksigner.jar" saida/ || true
          tail -n 40 build.log > saida/build.log
          ls -la saida

      - uses: actions/upload-artifact@v4
        with:
          name: apps-android-1.0.${{ github.run_number }}
          path: saida/

      # guarda o resultado (ou o erro) na branch "builds", para baixar com git
      - name: Publicar na branch builds
        if: always()
        run: |
          mkdir -p saida && cp build.log saida/build.log 2>/dev/null || true
          echo "${{ job.status }} run=${{ github.run_number }} commit=${{ github.sha }}" > saida/STATUS.txt
          cd saida
          git init -q && git checkout -q -b builds
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "build ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" builds
